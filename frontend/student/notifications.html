<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications — Course Registration System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <div class="sidebar-overlay"></div>

    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-brand-icon">🎓</div>
            <div class="sidebar-brand-text">Course Registration<small>Student Portal</small></div>
        </div>
        <nav class="sidebar-nav">
            <a href="/student/dashboard.html" class="sidebar-nav-item"><i class="bi bi-grid-1x2"></i> Dashboard</a>
            
            <a href="/student/my-courses.html" class="sidebar-nav-item"><i class="bi bi-bookmark-check"></i> My Units</a>
            <a href="/student/results.html" class="sidebar-nav-item"><i class="bi bi-graph-up"></i> Results</a>
            <a href="/student/timetable.html" class="sidebar-nav-item"><i class="bi bi-calendar-week"></i> Timetable</a>
            <a href="/student/history.html" class="sidebar-nav-item"><i class="bi bi-clock-history"></i> History</a>
            <a href="/student/profile.html" class="sidebar-nav-item"><i class="bi bi-person-circle"></i> Profile</a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" class="sidebar-nav-item" onclick="logout()" style="border:none;color:#ef5350;">
                <i class="bi bi-box-arrow-left"></i> Logout
            </a>
        </div>
    </aside>

    <header class="top-navbar">
        <div class="navbar-left">
            <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
            <span class="navbar-title">Notifications</span>
        </div>
        <div class="navbar-right"><button class="navbar-logout-btn" onclick="logout()" title="Logout"><i class="bi bi-box-arrow-left"></i><span>Logout</span></button>
            <div class="navbar-user">
                <div class="navbar-avatar" id="navbar-avatar">?</div>
                <div>
                    <div class="navbar-user-name" id="navbar-user-name">Loading...</div>
                    <div class="navbar-user-role" id="navbar-user-role">Student</div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="page-header fade-in" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
            <div>
                <h2><i class="bi bi-bell" style="color:var(--primary);"></i> Notifications</h2>
                <p>Your system alerts and registration updates</p>
            </div>
            <button class="btn-outline-custom btn-sm-custom" onclick="markAllRead()">
                <i class="bi bi-check-all"></i> Mark All Read
            </button>
        </div>

        <div class="card-custom slide-up" id="notifications-container">
            <div class="loading-spinner">
                <div class="spinner"></div>
                <span>Loading notifications...</span>
            </div>
        </div>
    </main>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script>
        let notificationsData = [];

        (async () => {
            const user = await requireAuth('student');
            if (!user) return;
            upgradeSidebarBrand();
            buildFooter();
            populateNavbar(user);
            await loadNotifications();
        })();

        async function loadNotifications() {
            showLoading('notifications-container');
            try {
                const data = await api.get('/student/notifications');
                notificationsData = data.notifications || [];
                renderNotifications();
            } catch (error) {
                showToast('Failed to load notifications.', 'error');
            }
        }

        function renderNotifications() {
            const container = document.getElementById('notifications-container');
            if (notificationsData.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-bell-slash"></i>
                        <h4>No Notifications</h4>
                        <p>You're all caught up! No new notifications.</p>
                    </div>`;
                return;
            }

            container.innerHTML = notificationsData.map(n => {
                const isUnread = !n.is_read;
                const icon = n.title.toLowerCase().includes('approved') ? 'bi-check-circle-fill' :
                             n.title.toLowerCase().includes('rejected') ? 'bi-x-circle-fill' :
                             n.title.toLowerCase().includes('announcement') ? 'bi-megaphone-fill' : 'bi-bell-fill';
                const iconColor = n.title.toLowerCase().includes('approved') ? 'var(--success)' :
                                  n.title.toLowerCase().includes('rejected') ? 'var(--danger)' :
                                  n.title.toLowerCase().includes('announcement') ? 'var(--info)' : 'var(--primary)';

                return `<div id="notif-${n.notification_id}" style="display:flex;gap:14px;padding:16px 20px;border-bottom:1px solid #f5f5f5;${isUnread ? 'background:var(--primary-lighter);' : ''}cursor:pointer;transition:var(--transition-fast);"
                    onclick="markRead(${n.notification_id})" onmouseover="this.style.background='#f9f0f4'" onmouseout="this.style.background='${isUnread ? 'var(--primary-lighter)' : 'white'}'">
                    <div style="flex-shrink:0;width:40px;height:40px;border-radius:50%;background:${iconColor}22;display:flex;align-items:center;justify-content:center;">
                        <i class="bi ${icon}" style="color:${iconColor};font-size:18px;"></i>
                    </div>
                    <div style="flex:1;min-width:0;">
                        <div style="display:flex;justify-content:space-between;align-items:start;gap:8px;">
                            <strong style="font-size:14px;${isUnread ? 'color:var(--primary);' : ''}">${n.title}</strong>
                            <span style="font-size:11px;color:var(--text-muted);white-space:nowrap;">${formatDate(n.created_at)}</span>
                        </div>
                        <p style="font-size:13px;color:var(--text-secondary);margin:4px 0 0;">${n.message || ''}</p>
                    </div>
                    ${isUnread ? '<div style="width:8px;height:8px;border-radius:50%;background:var(--primary);flex-shrink:0;margin-top:6px;"></div>' : ''}
                </div>`;
            }).join('');
        }

        async function markRead(id) {
            const notif = notificationsData.find(n => n.notification_id === id);
            if (!notif || notif.is_read) return;

            try {
                await api.put(`/student/notifications/${id}/read`);
                notif.is_read = 1;
                renderNotifications();
            } catch {}
        }

        async function markAllRead() {
            const unread = notificationsData.filter(n => !n.is_read);
            if (unread.length === 0) { showToast('All notifications already read.', 'info'); return; }

            try {
                await api.put('/student/notifications/read-all');
                await loadNotifications();
                showToast('All notifications marked as read.', 'success');
            } catch (error) {
                showToast(error.message || 'Failed to mark as read.', 'error');
            }
        }
    </script>
</body>
</html>
