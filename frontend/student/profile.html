<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — Course Registration System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <div class="sidebar-overlay"></div>

    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-brand-icon">🎓</div>
            <div class="sidebar-brand-text">Course Registration<small>Student Portal</small></div>
        </div>
        <nav class="sidebar-nav">
            <a href="/student/dashboard.html" class="sidebar-nav-item"><i class="bi bi-grid-1x2"></i> Dashboard</a>
            
            <a href="/student/my-courses.html" class="sidebar-nav-item"><i class="bi bi-bookmark-check"></i> My Units</a>
            <a href="/student/results.html" class="sidebar-nav-item"><i class="bi bi-graph-up"></i> Results</a>
            <a href="/student/timetable.html" class="sidebar-nav-item"><i class="bi bi-calendar-week"></i> Timetable</a>
            <a href="/student/history.html" class="sidebar-nav-item"><i class="bi bi-clock-history"></i> History</a>
            <a href="/student/profile.html" class="sidebar-nav-item active"><i class="bi bi-person-circle"></i> Profile</a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" class="sidebar-nav-item" onclick="logout()" style="border:none;color:#ef5350;">
                <i class="bi bi-box-arrow-left"></i> Logout
            </a>
        </div>
    </aside>

    <header class="top-navbar">
        <div class="navbar-left">
            <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
            <span class="navbar-title">My Profile</span>
        </div>
        <div class="navbar-right"><button class="navbar-logout-btn" onclick="logout()" title="Logout"><i class="bi bi-box-arrow-left"></i><span>Logout</span></button>
            <div class="navbar-notification" title="Notifications"
                 onclick="window.location.href='/student/notifications.html'" style="cursor:pointer;">
                <i class="bi bi-bell"></i>
            </div>
            <div class="navbar-user">
                <div class="navbar-avatar" id="navbar-avatar">?</div>
                <div>
                    <div class="navbar-user-name" id="navbar-user-name">Loading...</div>
                    <div class="navbar-user-role" id="navbar-user-role">Student</div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="page-header fade-in">
            <h2><i class="bi bi-person-circle" style="color:var(--primary);"></i> My Profile</h2>
            <p>View and update your personal information</p>
        </div>

        <div style="display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:start;" class="fade-in" id="profile-grid">

            <!-- Profile Photo Card -->
            <div class="card-custom" style="text-align:center;padding:30px 20px;">
                <div id="photo-container" style="position:relative;display:inline-block;margin-bottom:16px;">
                    <div id="avatar-display" style="width:100px;height:100px;border-radius:50%;background:var(--primary-gradient);display:flex;align-items:center;justify-content:center;color:white;font-size:36px;font-weight:700;margin:0 auto 12px;">?</div>
                    <label for="photo-input" style="position:absolute;bottom:10px;right:-5px;width:32px;height:32px;background:var(--primary);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-sm);" title="Change photo">
                        <i class="bi bi-camera-fill" style="color:white;font-size:14px;"></i>
                    </label>
                    <input type="file" id="photo-input" accept="image/png,image/jpeg,image/gif" style="display:none;" onchange="uploadPhoto(this)">
                </div>
                <h3 id="profile-name" style="font-size:16px;margin-bottom:4px;">Loading...</h3>
                <p id="profile-reg" style="color:var(--text-secondary);font-size:13px;margin-bottom:4px;"></p>
                <p id="profile-dept" style="color:var(--text-muted);font-size:12px;margin-bottom:0;"></p>
            </div>

            <!-- Profile Details & Edit -->
            <div style="display:flex;flex-direction:column;gap:20px;">

                <!-- Personal Info -->
                <div class="card-custom">
                    <div class="card-header-custom"><i class="bi bi-person"></i> Personal Information</div>
                    <div class="card-body-custom">
                        <form id="profile-form">
                            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
                                <div>
                                    <label class="form-label-custom">Full Name</label>
                                    <input type="text" id="student_name" class="form-control-custom" placeholder="Your full name" required>
                                </div>
                                <div>
                                    <label class="form-label-custom">Phone Number</label>
                                    <input type="tel" id="phone" class="form-control-custom" placeholder="e.g. 0712345678">
                                </div>
                                <div>
                                    <label class="form-label-custom">Email Address</label>
                                    <input type="email" id="email" class="form-control-custom" placeholder="Email" disabled style="background:#f5f5f5;cursor:not-allowed;">
                                    <small style="color:var(--text-muted);font-size:11px;">Email cannot be changed</small>
                                </div>
                                <div>
                                    <label class="form-label-custom">Registration Number</label>
                                    <input type="text" id="registration_number" class="form-control-custom" disabled style="background:#f5f5f5;cursor:not-allowed;">
                                </div>
                                <div>
                                    <label class="form-label-custom">Department</label>
                                    <input type="text" id="department_name" class="form-control-custom" disabled style="background:#f5f5f5;cursor:not-allowed;">
                                </div>
                                <div>
                                    <label class="form-label-custom">School</label>
                                    <input type="text" id="school_name" class="form-control-custom" disabled style="background:#f5f5f5;cursor:not-allowed;">
                                </div>
                            </div>
                            <button type="submit" class="btn-primary-custom" id="btn-save-profile">
                                <i class="bi bi-check-circle"></i> Save Changes
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Change Password -->
                <div class="card-custom">
                    <div class="card-header-custom"><i class="bi bi-lock"></i> Change Password</div>
                    <div class="card-body-custom">
                        <form id="password-form">
                            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px;">
                                <div>
                                    <label class="form-label-custom">Current Password</label>
                                    <div style="position:relative;">
                                        <input type="password" id="current_password" class="form-control-custom" placeholder="Current password" required>
                                    </div>
                                </div>
                                <div>
                                    <label class="form-label-custom">New Password</label>
                                    <input type="password" id="new_password" class="form-control-custom" placeholder="Min. 6 characters" required minlength="6">
                                </div>
                                <div>
                                    <label class="form-label-custom">Confirm New Password</label>
                                    <input type="password" id="confirm_password" class="form-control-custom" placeholder="Re-enter new password" required>
                                </div>
                            </div>
                            <button type="submit" class="btn-outline-custom" id="btn-change-pw">
                                <i class="bi bi-shield-lock"></i> Change Password
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script>
        let currentStudentData = null;

        (async () => {
            const user = await requireAuth('student');
            if (!user) return;
            upgradeSidebarBrand();
            buildFooter();
            populateNavbar(user);
            await loadProfile();
        })();

        async function loadProfile() {
            try {
                const data = await api.get('/student/profile');
                const s = data.student;
                currentStudentData = s;

                // Fill form fields
                document.getElementById('student_name').value = s.student_name || '';
                document.getElementById('phone').value = s.phone || '';
                document.getElementById('email').value = s.email || '';
                document.getElementById('registration_number').value = s.registration_number || 'Pending Admin Approval';
                document.getElementById('department_name').value = s.department_name || 'N/A';
                document.getElementById('school_name').value = s.school_name || 'N/A';

                // Sidebar photo card
                document.getElementById('profile-name').textContent = s.student_name;
                
                const profileRegEl = document.getElementById('profile-reg');
                if (s.registration_number) {
                    profileRegEl.textContent = s.registration_number;
                    profileRegEl.style.color = 'var(--text-secondary)';
                } else {
                    profileRegEl.textContent = 'Pending Admin Approval';
                    profileRegEl.style.color = '#ff9800'; // highlight pending state
                }

                document.getElementById('profile-dept').textContent = s.department_name || '';

                const avatarEl = document.getElementById('avatar-display');
                if (s.profile_photo) {
                    avatarEl.innerHTML = `<img src="/uploads/${s.profile_photo}" style="width:100px;height:100px;border-radius:50%;object-fit:cover;" alt="Profile Photo">`;
                } else {
                    avatarEl.textContent = getInitials(s.student_name);
                }

                // Update navbar avatar
                const navAvatar = document.getElementById('navbar-avatar');
                if (navAvatar) navAvatar.textContent = getInitials(s.student_name);

            } catch (error) {
                showToast('Failed to load profile.', 'error');
            }
        }

        // Save profile changes
        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-save-profile');
            btn.disabled = true;
            btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Saving...';

            try {
                const data = await api.put('/student/profile', {
                    student_name: document.getElementById('student_name').value.trim(),
                    phone: document.getElementById('phone').value.trim()
                });
                showToast(data.message || 'Profile updated!', 'success');
                await loadProfile();
            } catch (error) {
                showToast(error.message || 'Update failed.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-check-circle"></i> Save Changes';
            }
        });

        // Upload profile photo
        async function uploadPhoto(input) {
            if (!input.files || !input.files[0]) return;
            const formData = new FormData();
            formData.append('photo', input.files[0]);

            try {
                const data = await api.upload('/student/profile/photo', formData);
                showToast('Photo updated!', 'success');
                await loadProfile();
            } catch (error) {
                showToast(error.message || 'Photo upload failed.', 'error');
            }
        }

        // Change password
        document.getElementById('password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-change-pw');
            const newPw = document.getElementById('new_password').value;
            const confirmPw = document.getElementById('confirm_password').value;

            if (newPw !== confirmPw) {
                showToast('Passwords do not match.', 'error');
                return;
            }
            if (newPw.length < 6) {
                showToast('Password must be at least 6 characters.', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Updating...';

            try {
                const data = await api.put('/student/change-password', {
                    current_password: document.getElementById('current_password').value,
                    new_password: newPw
                });
                showToast(data.message || 'Password changed!', 'success');
                document.getElementById('password-form').reset();
            } catch (error) {
                showToast(error.message || 'Password change failed.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-shield-lock"></i> Change Password';
            }
        });
    </script>

    <style>
        @media (max-width: 900px) {
            #profile-grid { grid-template-columns: 1fr !important; }
        }
        @media (max-width: 600px) {
            #profile-form > div > div { grid-template-columns: 1fr !important; }
            #password-form > div > div { grid-template-columns: 1fr !important; }
        }
    </style>
</body>
</html>
