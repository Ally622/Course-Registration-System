<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schools — Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <div class="sidebar-overlay"></div>
    <aside class="sidebar">
        <div class="sidebar-brand"><div class="sidebar-brand-icon">🛡️</div><div class="sidebar-brand-text">Admin Panel<small>Management Portal</small></div></div>
        <nav class="sidebar-nav">
            <div class="sidebar-section-label">Overview</div>
            <a href="/admin/dashboard.html" class="sidebar-nav-item"><i class="bi bi-grid-1x2"></i> Dashboard</a>
            <div class="sidebar-section-label">Management</div>
            <a href="/admin/students.html" class="sidebar-nav-item"><i class="bi bi-people"></i> Students</a>
            <a href="/admin/lecturers.html" class="sidebar-nav-item"><i class="bi bi-person-video3"></i> Lecturers</a>
            <a href="/admin/courses.html" class="sidebar-nav-item"><i class="bi bi-journal-bookmark"></i> Courses</a>
            <a href="/admin/departments.html" class="sidebar-nav-item"><i class="bi bi-building"></i> Departments</a>
            <a href="/admin/faculties.html" class="sidebar-nav-item active"><i class="bi bi-building-fill"></i> Schools</a>
            <div class="sidebar-section-label">Academic</div>
            <a href="/admin/registrations.html" class="sidebar-nav-item"><i class="bi bi-clipboard-check"></i> Pending Approvals</a>
            <a href="/admin/announcements.html" class="sidebar-nav-item"><i class="bi bi-megaphone"></i> Announcements</a>
            <div class="sidebar-section-label">Reports</div>
            <a href="/admin/reports.html" class="sidebar-nav-item"><i class="bi bi-file-earmark-bar-graph"></i> Reports & Export</a>
        </nav>
        <div class="sidebar-footer"><a href="#" class="sidebar-nav-item" onclick="logout()" style="border:none;color:#ef5350;"><i class="bi bi-box-arrow-left"></i> Logout</a></div>
    </aside>

    <header class="top-navbar">
        <div class="navbar-left">
            <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
            <span class="navbar-title">Schools</span>
        </div>
        <div class="navbar-right"><button class="navbar-logout-btn" onclick="logout()" title="Logout"><i class="bi bi-box-arrow-left"></i><span>Logout</span></button>
            <div class="navbar-user">
                <div class="navbar-avatar" id="navbar-avatar">A</div>
                <div>
                    <div class="navbar-user-name" id="navbar-user-name">Admin</div>
                    <div class="navbar-user-role" id="navbar-user-role">Administrator</div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="page-header fade-in" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
            <div><h2><i class="bi bi-building" style="color:var(--primary);"></i> Schools</h2><p>Manage university schools</p></div>
            <button class="btn-primary-custom" onclick="openModal()"><i class="bi bi-plus-circle"></i> Add School</button>
        </div>

        <div class="card-custom slide-up" id="school-container">
            <div class="loading-spinner"><div class="spinner"></div><span>Loading...</span></div>
        </div>
    </main>

    <div id="school-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2000;align-items:center;justify-content:center;">
        <div style="background:white;border-radius:var(--border-radius);width:90%;max-width:440px;box-shadow:var(--shadow-lg);">
            <div style="background:var(--primary-gradient);color:white;padding:16px 20px;border-radius:var(--border-radius) var(--border-radius) 0 0;display:flex;justify-content:space-between;align-items:center;">
                <h3 id="modal-title" style="font-size:16px;font-weight:600;color:white;margin:0;"><i class="bi bi-plus-circle"></i> Add School</h3>
                <button onclick="closeModal()" style="background:none;border:none;color:white;font-size:20px;cursor:pointer;">&times;</button>
            </div>
            <div style="padding:24px;">
                <form id="school-form">
                    <input type="hidden" id="edit-school-id">
                    <div style="display:flex;flex-direction:column;gap:16px;">
                        <div><label class="form-label-custom">School Name *</label><input type="text" id="f-name" class="form-control-custom" placeholder="e.g. School of Science & Technology" required></div>
                        <div><label class="form-label-custom">Dean</label><input type="text" id="f-dean" class="form-control-custom" placeholder="e.g. Prof. Jane Doe"></div>
                    </div>
                    <div style="display:flex;gap:12px;margin-top:20px;justify-content:flex-end;">
                        <button type="button" class="btn-outline-custom" onclick="closeModal()">Cancel</button>
                        <button type="submit" class="btn-primary-custom" id="btn-save"><i class="bi bi-check-circle"></i> Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script>
        let editMode = false;

        (async () => {
            const user = await requireAuth('admin');
            if (!user) return;
            upgradeSidebarBrand();
            buildFooter();
            populateAdminNavbar(user);
            await loadSchools();
        })();

        async function loadSchools() {
            showLoading('school-container');
            try {
                const data = await api.get('/admin/schools');
                const schools = data.schools || [];
                if (schools.length === 0) { showEmpty('school-container', 'bi-building', 'No Schools', 'Add your first school.'); return; }
                document.getElementById('school-container').innerHTML = `
                    <div style="overflow-x:auto;">
                    <table class="table-custom">
                        <thead><tr><th>#</th><th>School Name</th><th>Dean</th><th>Departments</th><th>Actions</th></tr></thead>
                        <tbody>${schools.map((s, i) => `<tr>
                            <td>${i + 1}</td>
                            <td><strong>${s.school_name}</strong></td>
                            <td>${s.dean || 'N/A'}</td>
                            <td><span style="background:var(--primary-lighter);padding:2px 10px;border-radius:12px;font-weight:600;font-size:12px;">${s.department_count}</span></td>
                            <td>
                                <button class="btn-outline-custom btn-sm-custom" onclick="editSchool(${s.school_id})"><i class="bi bi-pencil"></i></button>
                                <button class="btn-danger-custom btn-sm-custom" onclick="deleteSchool(${s.school_id},'${s.school_name}')"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>`).join('')}</tbody>
                    </table></div>`;
            } catch { showToast('Failed to load schools.', 'error'); }
        }

        function openModal(isEdit = false) {
            editMode = isEdit;
            if (!isEdit) { document.getElementById('school-form').reset(); document.getElementById('edit-school-id').value = ''; document.getElementById('modal-title').innerHTML = '<i class="bi bi-plus-circle"></i> Add School'; }
            document.getElementById('school-modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('school-modal').style.display = 'none'; }

        async function editSchool(id) {
            try {
                const data = await api.get('/admin/schools');
                const s = data.schools.find(x => x.school_id === id);
                if (!s) return;
                document.getElementById('edit-school-id').value = s.school_id;
                document.getElementById('f-name').value = s.school_name;
                document.getElementById('f-dean').value = s.dean || '';
                document.getElementById('modal-title').innerHTML = '<i class="bi bi-pencil"></i> Edit School';
                openModal(true);
            } catch { showToast('Failed.', 'error'); }
        }

        document.getElementById('school-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-save');
            btn.disabled = true; btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Saving...';
            const schoolId = document.getElementById('edit-school-id').value;
            const payload = { school_name: document.getElementById('f-name').value.trim(), dean: document.getElementById('f-dean').value.trim() };
            try {
                if (editMode && schoolId) { await api.put(`/admin/schools/${schoolId}`, payload); showToast('School updated!', 'success'); }
                else { await api.post('/admin/schools', payload); showToast('School created!', 'success'); }
                closeModal(); await loadSchools();
            } catch (error) { showToast(error.message || 'Save failed.', 'error'); }
            finally { btn.disabled = false; btn.innerHTML = '<i class="bi bi-check-circle"></i> Save'; }
        });

        async function deleteSchool(id, name) {
            if (!confirm(`Delete school "${name}"? All departments in this school will also be removed.`)) return;
            try { await api.delete(`/admin/schools/${id}`); showToast('Deleted.', 'success'); await loadSchools(); }
            catch (error) { showToast(error.message || 'Failed.', 'error'); }
        }

        // populateAdminNavbar is defined in api.js
    </script>
</body>
</html>
