<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Courses — Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <div class="sidebar-overlay"></div>
    <aside class="sidebar">
        <div class="sidebar-brand"><div class="sidebar-brand-icon">🛡️</div><div class="sidebar-brand-text">Admin Panel<small>Management Portal</small></div></div>
        <nav class="sidebar-nav">
            <div class="sidebar-section-label">Overview</div>
            <a href="/admin/dashboard.html" class="sidebar-nav-item"><i class="bi bi-grid-1x2"></i> Dashboard</a>
            <div class="sidebar-section-label">Management</div>
            <a href="/admin/students.html" class="sidebar-nav-item"><i class="bi bi-people"></i> Students</a>
            <a href="/admin/lecturers.html" class="sidebar-nav-item"><i class="bi bi-person-video3"></i> Lecturers</a>
            <a href="/admin/courses.html" class="sidebar-nav-item active"><i class="bi bi-journal-bookmark"></i> Courses</a>
            <a href="/admin/departments.html" class="sidebar-nav-item"><i class="bi bi-building"></i> Departments</a>
            <a href="/admin/faculties.html" class="sidebar-nav-item"><i class="bi bi-building-fill"></i> Schools</a>
            <div class="sidebar-section-label">Academic</div>
            <a href="/admin/registrations.html" class="sidebar-nav-item"><i class="bi bi-clipboard-check"></i> Pending Approvals</a>
            <a href="/admin/announcements.html" class="sidebar-nav-item"><i class="bi bi-megaphone"></i> Announcements</a>
            <div class="sidebar-section-label">Reports</div>
            <a href="/admin/reports.html" class="sidebar-nav-item"><i class="bi bi-file-earmark-bar-graph"></i> Reports & Export</a>
        </nav>
        <div class="sidebar-footer"><a href="#" class="sidebar-nav-item" onclick="logout()" style="border:none;color:#ef5350;"><i class="bi bi-box-arrow-left"></i> Logout</a></div>
    </aside>

    <header class="top-navbar">
        <div class="navbar-left">
            <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
            <span class="navbar-title">Manage Courses</span>
        </div>
        <div class="navbar-right"><button class="navbar-logout-btn" onclick="logout()" title="Logout"><i class="bi bi-box-arrow-left"></i><span>Logout</span></button>
            <div class="navbar-user">
                <div class="navbar-avatar" id="navbar-avatar">A</div>
                <div>
                    <div class="navbar-user-name" id="navbar-user-name">Admin</div>
                    <div class="navbar-user-role" id="navbar-user-role">Administrator</div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="page-header fade-in" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
            <div><h2><i class="bi bi-journal-bookmark" style="color:var(--primary);"></i> Courses</h2><p>Create, edit and manage course units</p></div>
            <button class="btn-primary-custom" onclick="openModal()"><i class="bi bi-plus-circle"></i> Add Course</button>
        </div>

        <div class="card-custom slide-up" id="courses-container">
            <div class="loading-spinner"><div class="spinner"></div><span>Loading courses...</span></div>
        </div>
    </main>

    <!-- Course Modal -->
    <div id="course-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2000;align-items:center;justify-content:center;">
        <div style="background:white;border-radius:var(--border-radius);width:90%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);">
            <div style="background:var(--primary-gradient);color:white;padding:16px 20px;border-radius:var(--border-radius) var(--border-radius) 0 0;display:flex;justify-content:space-between;align-items:center;">
                <h3 id="modal-title" style="font-size:16px;font-weight:600;color:white;margin:0;"><i class="bi bi-plus-circle"></i> Add Course</h3>
                <button onclick="closeModal()" style="background:none;border:none;color:white;font-size:20px;cursor:pointer;">&times;</button>
            </div>
            <div style="padding:24px;">
                <form id="course-form">
                    <input type="hidden" id="edit-course-id">
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                        <div><label class="form-label-custom">Course Code *</label><input type="text" id="f-code" class="form-control-custom" placeholder="e.g. CSC 301" required></div>
                        <div><label class="form-label-custom">Credit Hours *</label><input type="number" id="f-credits" class="form-control-custom" value="3" min="1" max="6" required></div>
                        <div style="grid-column:1/-1;"><label class="form-label-custom">Course Name *</label><input type="text" id="f-name" class="form-control-custom" placeholder="Full course name" required></div>
                        <div><label class="form-label-custom">Programme</label><select id="f-prog" class="form-control-custom"><option value="">Select programme</option></select></div>
                        <div><label class="form-label-custom">Lecturer</label><select id="f-lecturer" class="form-control-custom"><option value="">Select lecturer</option></select></div>
                        <div><label class="form-label-custom">Semester</label><select id="f-semester" class="form-control-custom"><option value="1">Semester 1</option><option value="2">Semester 2</option></select></div>
                        <div><label class="form-label-custom">Year of Study</label><select id="f-year" class="form-control-custom"><option value="1">Year 1</option><option value="2">Year 2</option><option value="3">Year 3</option><option value="4">Year 4</option></select></div>
                        <div><label class="form-label-custom">Max Capacity</label><input type="number" id="f-capacity" class="form-control-custom" value="100" min="1"></div>
                        <div style="grid-column:1/-1;"><label class="form-label-custom">Description</label><textarea id="f-desc" class="form-control-custom" rows="2" placeholder="Short course description..." style="resize:vertical;"></textarea></div>
                    </div>
                    <div style="display:flex;gap:12px;margin-top:20px;justify-content:flex-end;">
                        <button type="button" class="btn-outline-custom" onclick="closeModal()">Cancel</button>
                        <button type="submit" class="btn-primary-custom" id="btn-save"><i class="bi bi-check-circle"></i> Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script>
        let editMode = false;
        let allLecturers = [];

        (async () => {
            const user = await requireAuth('admin');
            if (!user) return;
            upgradeSidebarBrand();
            buildFooter();
            populateAdminNavbar(user);
            await Promise.all([loadCourses(), loadProgrammes(), loadLecturers()]);
        })();

        async function loadProgrammes() {
            try {
                const data = await api.get('/api/programmes');
                const sel = document.getElementById('f-prog');
                data.programmes.forEach(d => sel.innerHTML += `<option value="${d.programme_id}">${d.programme_name}</option>`);
            } catch {}
        }

        async function loadLecturers() {
            try {
                const data = await api.get('/admin/lecturers');
                allLecturers = data.lecturers || [];
                const sel = document.getElementById('f-lecturer');
                allLecturers.forEach(l => sel.innerHTML += `<option value="${l.lecturer_id}">${l.lecturer_name}</option>`);
            } catch {}
        }

        async function loadCourses() {
            showLoading('courses-container');
            try {
                const data = await api.get('/admin/units');
                const courses = data.units || [];
                if (courses.length === 0) { showEmpty('courses-container', 'bi-journal-x', 'No Courses', 'Add your first course.'); return; }
                document.getElementById('courses-container').innerHTML = `
                    <div style="overflow-x:auto;">
                    <table class="table-custom">
                        <thead><tr><th>#</th><th>Code</th><th>Name</th><th>Credits</th><th>Programme</th><th>Lecturer</th><th>Sem/Yr</th><th>Actions</th></tr></thead>
                        <tbody>${courses.map((c, i) => `<tr>
                            <td>${i + 1}</td>
                            <td><strong style="color:var(--primary);">${c.unit_code}</strong></td>
                            <td>${c.unit_name}</td>
                            <td><span style="background:var(--primary-lighter);padding:2px 10px;border-radius:12px;font-weight:600;font-size:12px;">${c.credit_hours}</span></td>
                            <td style="font-size:12px;">${c.programme_name || 'N/A'}</td>
                            <td style="font-size:12px;">${c.lecturer_name || 'TBA'}</td>
                            <td style="font-size:12px;">S${c.semester_number} / Y${c.year_of_study}</td>
                            <td>
                                <button class="btn-outline-custom btn-sm-custom" onclick="editCourse(${c.unit_id})"><i class="bi bi-pencil"></i></button>
                                <button class="btn-danger-custom btn-sm-custom" onclick="deleteCourse(${c.unit_id},'${c.unit_code}')"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>`).join('')}</tbody>
                    </table></div>`;
            } catch { showToast('Failed to load courses.', 'error'); }
        }

        function openModal(isEdit = false) {
            editMode = isEdit;
            if (!isEdit) {
                document.getElementById('course-form').reset();
                document.getElementById('edit-course-id').value = '';
                document.getElementById('modal-title').innerHTML = '<i class="bi bi-plus-circle"></i> Add Course';
            }
            document.getElementById('course-modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('course-modal').style.display = 'none'; }

        async function editCourse(id) {
            try {
                const data = await api.get('/admin/units');
                const c = data.units.find(x => x.unit_id === id);
                if (!c) return;
                document.getElementById('edit-course-id').value = c.unit_id;
                document.getElementById('f-code').value = c.unit_code;
                document.getElementById('f-name').value = c.unit_name;
                document.getElementById('f-credits').value = c.credit_hours;
                document.getElementById('f-prog').value = c.programme_id || '';
                document.getElementById('f-lecturer').value = c.lecturer_id || '';
                document.getElementById('f-semester').value = c.semester_number || 1;
                document.getElementById('f-year').value = c.year_of_study || 1;
                document.getElementById('modal-title').innerHTML = '<i class="bi bi-pencil"></i> Edit Course';
                openModal(true);
            } catch { showToast('Failed to load course data.', 'error'); }
        }

        document.getElementById('course-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-save');
            btn.disabled = true;
            btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Saving...';
            const courseId = document.getElementById('edit-course-id').value;
            const payload = {
                unit_code: document.getElementById('f-code').value.trim(),
                unit_name: document.getElementById('f-name').value.trim(),
                credit_hours: parseInt(document.getElementById('f-credits').value),
                programme_id: document.getElementById('f-prog').value || null,
                lecturer_id: document.getElementById('f-lecturer').value || null,
                semester_number: parseInt(document.getElementById('f-semester').value),
                year_of_study: parseInt(document.getElementById('f-year').value),
                max_capacity: parseInt(document.getElementById('f-capacity').value) || 100,
                description: document.getElementById('f-desc').value.trim()
            };
            try {
                if (editMode && courseId) { await api.put(`/admin/units/${courseId}`, payload); showToast('Course updated!', 'success'); }
                else { await api.post('/admin/units', payload); showToast('Course created!', 'success'); }
                closeModal();
                await loadCourses();
            } catch (error) { showToast(error.message || 'Save failed.', 'error'); }
            finally { btn.disabled = false; btn.innerHTML = '<i class="bi bi-check-circle"></i> Save'; }
        });

        async function deleteCourse(id, code) {
            if (!confirm(`Delete course "${code}"? This cannot be undone.`)) return;
            try { await api.delete(`/admin/units/${id}`); showToast('Course deleted.', 'success'); await loadCourses(); }
            catch (error) { showToast(error.message || 'Failed.', 'error'); }
        }

        // populateAdminNavbar is defined in api.js
    </script>
</body>
</html>
