<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Course Registration System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/auth.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-brand-panel">
            <div class="auth-brand-logo">🔑</div>
            <h1 class="auth-brand-title">Reset Password</h1>
            <p class="auth-brand-subtitle">
                Enter your email address and we'll send you instructions to reset your password.
            </p>
        </div>

        <div class="auth-form-panel">
            <div class="auth-form-container">
                <!-- Step 1: Request Reset -->
                <div id="step-request">
                    <h2 class="auth-form-title">Forgot Password</h2>
                    <p class="auth-form-subtitle">Enter your registered email address</p>

                    <div class="auth-error-message" id="error-message">
                        <i class="bi bi-exclamation-circle"></i>
                        <span id="error-text"></span>
                    </div>

                    <form id="forgot-form" novalidate>
                        <div class="auth-form-group">
                            <label for="email">Email Address</label>
                            <div class="input-icon-wrapper">
                                <i class="bi bi-envelope"></i>
                                <input type="email" id="email" placeholder="Enter your email" required>
                            </div>
                        </div>

                        <button type="submit" class="auth-btn-submit" id="btn-request">
                            <span id="btn-text-request">Reset Password</span>
                        </button>
                    </form>

                    <div class="auth-form-footer">
                        <a href="/login.html"><i class="bi bi-arrow-left"></i> Back to Login</a>
                    </div>
                </div>

                <!-- Step 2: Enter Token + New Password -->
                <div id="step-reset" style="display:none;">
                    <h2 class="auth-form-title">Set New Password</h2>
                    <p class="auth-form-subtitle">Enter the reset token and your new password</p>

                    <div class="auth-error-message" id="error-message-2">
                        <i class="bi bi-exclamation-circle"></i>
                        <span id="error-text-2"></span>
                    </div>

                    <form id="reset-form" novalidate>
                        <div class="auth-form-group">
                            <label for="token">Reset Token</label>
                            <div class="input-icon-wrapper">
                                <i class="bi bi-key"></i>
                                <input type="text" id="token" placeholder="Paste your reset token" required>
                            </div>
                        </div>

                        <div class="auth-form-group">
                            <label for="new_password">New Password</label>
                            <div class="input-icon-wrapper">
                                <i class="bi bi-lock"></i>
                                <input type="password" id="new_password" placeholder="Minimum 6 characters" required minlength="6">
                            </div>
                        </div>

                        <div class="auth-form-group">
                            <label for="confirm_password">Confirm New Password</label>
                            <div class="input-icon-wrapper">
                                <i class="bi bi-lock-fill"></i>
                                <input type="password" id="confirm_password" placeholder="Re-enter new password" required>
                            </div>
                        </div>

                        <button type="submit" class="auth-btn-submit" id="btn-reset">
                            <span id="btn-text-reset">Update Password</span>
                        </button>
                    </form>

                    <div class="auth-form-footer">
                        <a href="/login.html"><i class="bi bi-arrow-left"></i> Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script>
        buildPublicHeader();
        buildFooter();
        // Step 1: Request reset token
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-request');
            const btnText = document.getElementById('btn-text-request');
            const errorDiv = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            errorDiv.classList.remove('show');

            const email = document.getElementById('email').value.trim();
            if (!email) {
                errorText.textContent = 'Please enter your email.';
                errorDiv.classList.add('show');
                return;
            }

            btn.disabled = true;
            btnText.textContent = 'Sending...';

            try {
                const data = await api.post('/auth/forgot-password', { email });
                showToast('Reset token generated! Check below.', 'success');

                // If token returned (dev mode), pre-fill it
                if (data.token) {
                    document.getElementById('token').value = data.token;
                }

                document.getElementById('step-request').style.display = 'none';
                document.getElementById('step-reset').style.display = 'block';

            } catch (error) {
                errorText.textContent = error.message || 'Failed to send reset.';
                errorDiv.classList.add('show');
                btn.disabled = false;
                btnText.textContent = 'Reset Password';
            }
        });

        // Step 2: Reset password with token
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-reset');
            const btnText = document.getElementById('btn-text-reset');
            const errorDiv = document.getElementById('error-message-2');
            const errorText = document.getElementById('error-text-2');
            errorDiv.classList.remove('show');

            const token = document.getElementById('token').value.trim();
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            if (!token || !newPassword) {
                errorText.textContent = 'All fields are required.';
                errorDiv.classList.add('show');
                return;
            }
            if (newPassword.length < 6) {
                errorText.textContent = 'Password must be at least 6 characters.';
                errorDiv.classList.add('show');
                return;
            }
            if (newPassword !== confirmPassword) {
                errorText.textContent = 'Passwords do not match.';
                errorDiv.classList.add('show');
                return;
            }

            btn.disabled = true;
            btnText.textContent = 'Updating...';

            try {
                await api.post('/auth/reset-password', {
                    token: token,
                    new_password: newPassword
                });

                showToast('Password reset successfully!', 'success');
                setTimeout(() => window.location.href = '/login.html', 1500);

            } catch (error) {
                errorText.textContent = error.message || 'Reset failed.';
                errorDiv.classList.add('show');
                btn.disabled = false;
                btnText.textContent = 'Update Password';
            }
        });
    </script>
</body>
</html>
